[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1engine"
version = "2.0.0"
description = "Local Formula 1 forecasts with reproducible evidence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.128,<1", "uvicorn>=0.40,<1", "pydantic>=2.12,<3",
  "numpy>=2.2,<3", "pandas>=2.2,<3", "pyarrow>=23,<25",
  "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "xgboost>=3,<4",
  "httpx>=0.28,<1", "fastf1>=3.6,<4", "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3", "playwright>=1.55,<2"]

[project.scripts]
f1engine = "f1engine.cli:main"

[tool.setuptools.packages.find]
where = ["v2"]

[tool.pytest.ini_options]
testpaths = ["v2_tests"]
pythonpath = ["v2"]
markers = ["browser: opt-in local browser checks","integration: explicit network integration checks", "performance: measured simulation benchmarks"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.package-data]
f1engine = ["static/*", "static/assets/*", "static/licenses/*"]
